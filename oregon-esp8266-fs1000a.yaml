# oregon-esp8266-fs1000a.yaml — production build (ESP8266 / NodeMCU v3 + FS1000A) on the `oregon` component
#
# The "budget build": a NodeMCU (ESP8266) + an FS1000A. Emulates Oregon Scientific 433.92 MHz
# sensors toward a BAR989HG base (Oregon-compatible):
#   ch1 = RTGN318 temp/humidity (~53.2s) + RTGR328N clock (every 10min) + UVR128 UV (~73s).
#
# Same external component as the ESP32 builds — only the platform layer differs:
#   - esp8266: block instead of esp32: (and no Bluetooth — the ESP8266 has none)
#   - the source data must reach HA some other way (a separate bluetooth_proxy), since this board
#     can't host the SwitchBot->HA proxy itself. With that in place ch1 transmits real readings.
#   - distinct node name ("oregon-esp8266") so it never collides with "oregon-all-in-one" on mDNS/OTA.
#
# Validated 2026-06-28: ~8h uptime, 5-channel stress (ch1 + extra 2-5) — cadences held, no resets,
# no post-boot warnings. Single-core WiFi jitter on the OOK bit-bang was not an issue.
#
# Workflow: drop the whole `components/oregon/` folder into /config/esphome/components/ once
#   (external_components below finds it), instead of copying Oregon_TM.h/.cpp by hand.
#
# FS1000A wiring: DATA->D1 (GPIO5)   GND->GND   Antenna ~17.3cm wire (1/4 wave @ 433.92 MHz).
#   Avoid strapping pins (GPIO0/2/15) for DATA.
#   VCC power: use VU (USB 5V) for full range, or 3V3 (works, reduced range). Do not use VIN —
#   on the LoLin v3 it's a power-input and delivers no usable 5V from USB, so the FS1000A stays
#   under-powered and the base hears nothing. (The DATA line is fine at 3.3V logic either way.)
#
# If compile fails with "section .text will not fit in region iram1" (IRAM overflow): the TX
#   routines in Oregon_TM.cpp are marked IRAM_ATTR. On the tight ESP8266 IRAM that can overflow.
#   Fix = drop IRAM_ATTR on ESP8266 (they then live in flash; a touch slower, usually fine).

substitutions:
  name: "oregon-esp8266"
  friendly_name: "Donet Weather Transmitter ESP8266 (Oregon-compatible)"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # No `includes:` / `libraries:` — the external component declares both.

esp8266:
  board: nodemcuv2          # NodeMCU v3 (LoLin) is an ESP-12E -> the nodemcuv2 board fits

# No esp32_ble_tracker / bluetooth_proxy here — the ESP8266 has no Bluetooth. Feed
# ha_temperature/ha_humidity from a separate bluetooth proxy elsewhere on your network.

logger:
  baud_rate: 115200
  level: INFO

api:
  encryption:
    key: !secret oregon_esp8266__api_encryption_key

ota:
  - platform: esphome
    password: !secret oregon_esp8266__ota_password

wifi:
  # If mDNS (oregon-esp8266.local) won't resolve for OTA, uncomment and set the board's IP:
  #use_address: 192.168.1.50
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ext_ssid
      password: !secret wifi_ext_password

time:
  - platform: sntp
    id: sntp_time
    timezone: "CET-1CEST,M3.5.0/2,M10.5.0/3"

# The external component (local folder: ./components/oregon)
external_components:
  - source:
      type: local
      path: components       # folder that CONTAINS the `oregon/` component dir
    components: [oregon]

# Home Assistant source sensors
sensor:
  - platform: homeassistant
    entity_id: !secret oregon_all_in_one__sensor-temp-1
    id: ha_temperature
    internal: true
  - platform: homeassistant
    entity_id: !secret oregon_all_in_one__sensor-hum-1
    id: ha_humidity
    internal: true
  - platform: homeassistant
    entity_id: !secret oregon_all_in_one__sensor-uv
    id: ha_uv
    internal: true
  # Optional: extra sensors 2-5 (see the commented `extra_channels:` block below).
  # To enable an extra sensor, uncomment its source block here AND its entry under
  # `extra_channels:` (a matched pair), and add the matching keys to secrets.yaml.
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-temp-2
  #  id: ha_temperature_2
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-hum-2
  #  id: ha_humidity_2
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-temp-3
  #  id: ha_temperature_3
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-hum-3
  #  id: ha_humidity_3
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-temp-4
  #  id: ha_temperature_4
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-hum-4
  #  id: ha_humidity_4
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-temp-5
  #  id: ha_temperature_5
  #  internal: true
  #- platform: homeassistant
  #  entity_id: !secret oregon_all_in_one__sensor-hum-5
  #  id: ha_humidity_5
  #  internal: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"      # handy to grab the IP for OTA if mDNS is flaky on ESP8266
    ssid:
      name: "Connected SSID"

button:
  - platform: restart
    name: "Restart ESP8266"
    icon: "mdi:restart"

# The Oregon transmitter
oregon:
  id: oregon_tx
  radio: fs1000a
  tx_pin: 5               # D1 on the NodeMCU (GPIO5) -> FS1000A DATA
  time_id: sntp_time
  channel: 1
  th_interval: 53s        # default — matches the library's ch1 send_time exactly
  clock_interval: 10min
  th_clock_gap: 5s
  uv_interval: 73s
  uv_boot: 5              # UV fallback until HA pushes the real value
  temperature: ha_temperature
  humidity: ha_humidity
  uv: ha_uv
  # Diagnostic entities (ch1) — optional; omit any you don't want in HA.
  last_sent_temperature: { name: "Last Sent Temperature" }
  last_sent_humidity:    { name: "Last Sent Humidity" }
  th_tx_count:           { name: "Temperature TX Count" }
  clock_tx_count:        { name: "Clock TX Count" }
  last_sent_clock:       { name: "Last Sent Clock" }
  tx_status:             { name: "TX Status" }
  # Optional feature: extra sensors 2-5.
  # Emulate up to 4 more TH sensors, each on its own channel. To enable one, uncomment its
  # entry here AND its source block in `sensor:` above (matched pair), then add the secrets.
  #   model: default rtgn318 (TH + own clock; channels 2-5; distinct codes, no collisions,
  #          works on a 5-channel base like the BAR989HG).
  #          Use `model: thgn132` (TH-only, channels 2-3 only) for a 3-channel station.
  #   interval: omit -> the library's natural per-channel/model cadence.
  # Validated as a 5-channel stress test on this ESP8266 (ch1 + 2-5).
  #extra_channels:
  #  - channel: 2
  #    temperature: ha_temperature_2
  #    humidity: ha_humidity_2
  #  - channel: 3
  #    temperature: ha_temperature_3
  #    humidity: ha_humidity_3
  #  - channel: 4
  #    temperature: ha_temperature_4
  #    humidity: ha_humidity_4
  #  - channel: 5
  #    temperature: ha_temperature_5
  #    humidity: ha_humidity_5
  # No cc1101_* SPI pins — ignored for radio: fs1000a (bit-banged OOK on tx_pin).
